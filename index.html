<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber & Co. – Prenota</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0c0b0a;--card:#17140f;--tx:#f3ead8;--mu:#a39a88;--gold:#d4af37;--gold2:#f1d98a;--bd:#3a3121;--hero:#2a2113;--ink:#1a1408}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f5efe3;--card:#fffdf8;--tx:#1a1714;--mu:#6f665a;--gold:#9a7421;--gold2:#c9a24b;--bd:#e0d3b8;--hero:#ecdcb6;--ink:#fffdf8}}
:root[data-theme="light"]{color-scheme:light;--bg:#f5efe3;--card:#fffdf8;--tx:#1a1714;--mu:#6f665a;--gold:#9a7421;--gold2:#c9a24b;--bd:#e0d3b8;--hero:#ecdcb6;--ink:#fffdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Montserrat,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
.hero{display:flex;align-items:center;gap:28px;padding:26px 22px;background:radial-gradient(120% 150% at 15% 0,var(--hero) 0,var(--bg) 65%)}
.hero .in{max-width:820px;margin:0 auto;width:100%;display:flex;align-items:center;gap:28px}
.hero h1{margin:0;font:700 clamp(30px,7vw,48px)/1.05 "Playfair Display",Georgia,serif;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--mu);letter-spacing:3px;font-size:11px;text-transform:uppercase}
.nav{margin-left:auto;display:flex;flex-direction:column;gap:8px}
.gl{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stage{perspective:700px;flex:none;padding:0 14px}
.pole3d{position:relative;width:44px;height:150px;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite;filter:drop-shadow(0 12px 18px #0008)}
@keyframes sway{0%,100%{transform:rotateY(-22deg) rotateX(6deg)}50%{transform:rotateY(22deg) rotateX(-4deg)}}
.tube{position:absolute;inset:14px 0;border-radius:6px;background:repeating-linear-gradient(-45deg,#c62828 0 14px,#f4f4f4 14px 28px,#1f3c88 28px 42px);background-size:100% 59.4px;animation:spin 1.4s linear infinite}
.tube:after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(90deg,#0009,#fff5 28%,#0000 55%,#000a)}
@keyframes spin{to{background-position-y:59.4px}}
.cap{position:absolute;left:-5px;right:-5px;height:20px;border-radius:10px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:inset 0 -3px 6px #0004}
.cap.t{top:0}.cap.b{bottom:0}
#logo{max-width:120px;max-height:88px;object-fit:contain;display:block}#logo[hidden]{display:none}
[hidden]{display:none!important}
#land{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 20px;background:radial-gradient(70% 60% at 50% 38%,var(--hero),var(--bg) 72%)}
.lc{position:relative;z-index:2;max-width:900px}
.silk{position:absolute;inset:0;width:100%;height:100%}
.silk path{fill:none;stroke:var(--gold);stroke-width:1.3;opacity:.4;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 7s ease-in-out infinite alternate}
.silk path:nth-child(2){animation-delay:1.2s}.silk path:nth-child(3){animation-delay:2.4s}
@keyframes dr{to{stroke-dashoffset:0}}
.f{position:absolute;color:var(--gold);opacity:.22;transition:transform .6s ease-out;pointer-events:none}
.f>div{animation:drift ease-in-out infinite alternate}.f svg{display:block;width:100%;height:auto}
@keyframes drift{from{transform:translateY(-16px) rotate(-14deg)}to{transform:translateY(16px) rotate(16deg)}}
#logo2{display:block;max-height:84px;max-width:200px;margin:0 auto 10px;object-fit:contain}
.scis{width:min(50vw,190px);margin:0 auto}
.scis svg{width:100%;overflow:visible;filter:drop-shadow(0 12px 24px #d4af3744)}
.sa,.sb{transform-origin:100px 104px}
.sa{animation:snA 2.8s cubic-bezier(.65,0,.3,1) infinite}.sb{animation:snB 2.8s cubic-bezier(.65,0,.3,1) infinite}
@keyframes snA{0%,100%{transform:rotate(4deg)}30%,42%{transform:rotate(26deg)}58%{transform:rotate(3deg)}}
@keyframes snB{0%,100%{transform:rotate(-4deg)}30%,42%{transform:rotate(-26deg)}58%{transform:rotate(-3deg)}}
.g{fill:none;stroke:var(--gold2);stroke-width:6;stroke-linecap:round}
.hs{fill:none;stroke:var(--gold2);stroke-width:2.2;stroke-linecap:round;opacity:0;transform-origin:100px 20px;animation:fall 2.8s var(--d,0s) infinite}
@keyframes fall{0%,55%{opacity:0;transform:none}58%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),130px) rotate(50deg)}}
.wl,.wn{perspective:700px}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;color:var(--cb,var(--gold2));opacity:0;transform:translateY(42px) rotateX(-80deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards,glint 6s ease-in-out infinite;animation-delay:calc(var(--i)*45ms),calc(2s + var(--i)*80ms)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes glint{0%,14%,100%{color:var(--cb,var(--gold2));text-shadow:none}7%{color:#fff;text-shadow:0 0 26px var(--gold)}}
.wl{--cb:var(--tx);font:600 clamp(18px,4.2vw,30px)/1.3 'Playfair Display',Georgia,serif;letter-spacing:4px;text-transform:uppercase;margin:16px 0 4px}
.wn{margin:0;font:700 clamp(42px,12vw,96px)/1.02 'Playfair Display',Georgia,serif}
.wt{margin:14px 0 0;color:var(--mu);letter-spacing:3px;font-size:12px;text-transform:uppercase;opacity:0;animation:up .9s 1.5s forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mag{display:inline-block;margin-top:30px;transition:transform .25s ease-out}
.cta{position:relative;overflow:hidden;display:inline-flex;gap:12px;align-items:center;padding:18px 34px;border:0;border-radius:999px;font:700 clamp(15px,3.6vw,18px) Montserrat,sans-serif;letter-spacing:.5px;color:var(--ink);background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer;opacity:0;animation:up .9s 1.9s forwards,ring 2.6s 3s infinite}
.cta:after{content:'';position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:sheen 3.4s 3s infinite}
@keyframes sheen{0%{left:-90px}35%,100%{left:120%}}
@keyframes ring{0%{box-shadow:0 0 0 0 #d4af3788}70%,100%{box-shadow:0 0 0 22px #d4af3700}}
.cta svg{width:22px;height:22px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.wipe{position:fixed;inset:0;z-index:50;pointer-events:none}.wipe.on{pointer-events:all}
.wipe i{position:absolute;inset:0;transition:transform .65s cubic-bezier(.77,0,.18,1)}
.wipe i:first-child{background:linear-gradient(135deg,var(--gold2),var(--gold));clip-path:polygon(0 0,58.2% 0,42.2% 100%,0 100%);transform:translateX(-110%)}
.wipe i:last-child{background:var(--card);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);transform:translateX(110%)}
.wipe.on i{transform:none}
body.enter .hero .in,body.enter #app>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
body.enter #app>*:nth-child(2){animation-delay:.1s}body.enter #app>*:nth-child(3){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){#land *,.wipe i{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
@media(prefers-reduced-motion:reduce){.pole3d,.tube{animation:none}}
button,select,input{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:11px 18px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);font-weight:600;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 18px #0004}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--gold);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
h2{font:700 26px "Playfair Display",Georgia,serif;margin:8px 0 16px}
h3{margin:26px 0 10px;font:700 19px "Playfair Display",Georgia,serif;color:var(--gold)}
.steps{display:flex;gap:6px;margin:6px 0 18px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--bd)}.steps i.on{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;perspective:1000px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.svc{display:block;width:100%;text-align:left;cursor:pointer;color:var(--tx);padding:20px;transform-style:preserve-3d;transition:transform .15s ease-out,border-color .2s,box-shadow .2s;box-shadow:0 14px 34px #0005;background:linear-gradient(145deg,#ffffff0d,#0000 60%),var(--card)}
.svc:hover{border-color:var(--gold);box-shadow:0 18px 44px #0007,0 0 0 1px var(--gold) inset}
.svc svg{width:50px;height:50px;color:var(--gold);transform:translateZ(34px);display:block}
.svc b{display:block;font:700 19px "Playfair Display",Georgia,serif;margin-top:10px;transform:translateZ(22px)}
.svc small{display:block;color:var(--mu);transform:translateZ(14px)}
.svc .price{float:right;font:700 22px "Playfair Display",Georgia,serif;color:var(--gold2);transform:translateZ(30px)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.day{flex:none;width:62px;padding:9px 0;text-align:center;border:1px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer}
.day small{display:block;color:var(--mu);text-transform:uppercase;font-size:10px;letter-spacing:1px}.day b{font:700 21px "Playfair Display",Georgia,serif}
.day.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:var(--ink)}.day.on small{color:var(--ink)}
.day.off{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.slot{padding:9px 15px;border:1px solid var(--gold);border-radius:999px;background:transparent;cursor:pointer;font-weight:600}
.slot.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink)}
.field{display:block;margin:10px 0}.field span{display:block;font-size:12px;color:var(--mu);margin-bottom:3px;letter-spacing:1px;text-transform:uppercase}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
input:focus,select:focus{outline:2px solid var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}.row input{width:auto;flex:1;min-width:80px}.row select{width:auto}
.mu{color:var(--mu);font-size:14px}
.ok{text-align:center;padding:34px 12px}.ok svg{width:72px;height:72px;color:var(--gold)}
.hint{border:1px dashed var(--bd);border-radius:12px;padding:12px;font-size:13px;color:var(--mu);margin-top:22px}
.bk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}
@media(max-width:560px){.hero,.hero .in{gap:14px}.nav{flex-direction:row}}
</style></head>
<body>
<section id='land'>
<svg class='silk' viewBox='0 0 1000 600' preserveAspectRatio='none' aria-hidden='true'><path pathLength='1' d='M-20 420C200 300 330 560 520 430S820 250 1040 380'/><path pathLength='1' d='M-20 250C180 150 360 330 540 220S840 90 1040 200'/><path pathLength='1' d='M-20 520C240 470 400 600 620 520S880 430 1040 500'/></svg>

<g class='sa'><path d='M95 104L108 104L101 8Z' fill='url(#gg)'/><path class='g' d='M100 104L86 158'/><circle class='g' cx='86' cy='158' r='17'/></g>
<g class='sb'><path d='M105 104L92 104L99 8Z' fill='url(#gg)'/><path class='g' d='M100 104L114 158'/><circle class='g' cx='114' cy='158' r='17'/></g>
<circle cx='100' cy='104' r='6' fill='#f1d98a' stroke='#6b4e12' stroke-width='2'/>
<path class='hs' style='--x:-26px' d='M100 16c-7 9 7 17 0 28'/><path class='hs' style='--x:4px;--d:.05s' d='M98 14c8 8-6 18 1 26'/><path class='hs' style='--x:30px;--d:.1s' d='M102 18c-6 10 6 14 0 24'/></svg></div>
<p class='wl' id='wl'></p><h1 class='wn' id='wn'></h1><p class='wt' id='wt'></p>

</div></section>

  <div class="stage" aria-hidden="true"><img id="logo" alt="" hidden><svg id="emb" viewBox="0 0 96 96" width="88" height="88" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold);display:block"><circle cx="48" cy="48" r="45" stroke-width="2"/><circle cx="48" cy="48" r="39" stroke-width=".8"/><g transform="translate(24 24)" stroke-width="2.4"><circle cx="11" cy="37" r="6"/><circle cx="25" cy="39" r="6"/><path d="M15 32 40 6M22 34 12 6"/></g></svg></div>
  <div><h1 id="shop"></h1><p id="sub"></p></div>

</div></section>

<script>
var IC={
 s:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="37" r="6"/><circle cx="25" cy="39" r="6"/><path d="M15 32 40 6M22 34 12 6"/></svg>',
 c:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="14" width="40" height="12" rx="3"/><path d="M9 26v10M15 26v10M21 26v10M27 26v10M33 26v10M39 26v10"/></svg>',
 r:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30 34 12l8 10-26 16z"/><path d="M12 26l6 8M34 12 40 6"/></svg>',
 w:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5C16 16 11 22 11 30a13 13 0 0 0 26 0c0-8-5-14-13-25z"/><path d="M18 31a6 6 0 0 0 6 6"/></svg>',
 p:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="17" y="5" width="14" height="38" rx="7"/><path d="M17 17l14-6M17 27l14-6M17 37l14-6"/></svg>'
};
var ICN=[["s","Forbici"],["c","Pettine"],["r","Rasoio"],["w","Shampoo"],["p","Barber pole"]];
var DAYS=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
var DEF={shop:"Barber & Co.",wel:"Benvenuto da",sub:"Barbiere · Parrucchiere · dal 1987",logo:"",pin:"1234",step:30,
 chairs:[{id:1,n:"Poltrona 1"},{id:2,n:"Poltrona 2"}],
 services:[{id:1,n:"Taglio uomo",p:18,d:30,i:"s"},{id:2,n:"Barba",p:10,d:30,i:"r"},{id:3,n:"Taglio + barba",p:25,d:60,i:"c"},{id:4,n:"Shampoo",p:8,d:15,i:"w"},{id:5,n:"Taglio bimbo",p:12,d:30,i:"s"}],
 hours:[{x:1,o:"09:00",c:"19:00"},{x:1,o:"09:00",c:"19:00"},{x:0,o:"09:00",c:"19:00"},{x:0,o:"09:00",c:"19:00"},{x:0,o:"09:00",c:"19:00"},{x:0,o:"09:00",c:"19:00"},{x:0,o:"09:00",c:"18:00"}],
 closures:[],bookings:[]};
var S=load(),V="l",A=false,st={step:0,sid:null,date:null,time:null,done:null};
function load(){try{var j=localStorage.getItem("bbk2");if(j)return JSON.parse(j)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem("bbk2",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function p2(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function mins(t){var a=t.split(":");return+a[0]*60+ +a[1]}
function hm(m){return p2(Math.floor(m/60))+":"+p2(m%60)}
function dl(m){return m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":"")}
function svc(id){return S.services.find(function(s){return s.id==id})}
function cn(id){var c=S.chairs.find(function(c){return c.id==id});return c?c.n:"Poltrona"}
function dayOpen(ds){var h=S.hours[new Date(ds+"T12:00:00").getDay()];return!h.x&&S.closures.indexOf(ds)<0}
function fdate(ds){var d=new Date(ds+"T12:00:00");return DAYS[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)}
function freeChair(ds,t,dur){
  for(var i=0;i<S.chairs.length;i++){var c=S.chairs[i];
    var busy=S.bookings.some(function(b){return b.date==ds&&b.ch==c.id&&t<mins(b.time)+b.d&&mins(b.time)<t+dur});
    if(!busy)return c.id}
  return null}
function slots(ds,dur){
  if(!dayOpen(ds))return[];
  var h=S.hours[new Date(ds+"T12:00:00").getDay()],o=mins(h.o),c=mins(h.c),out=[],n=new Date(),nm=iso(n)==ds?n.getHours()*60+n.getMinutes():-1;
  for(var t=o;t+dur<=c;t+=S.step){if(t<=nm)continue;if(freeChair(ds,t,dur)!==null)out.push(hm(t))}
  return out}
function go(v){V=v;if(v=="c")st={step:0,sid:null,date:null,time:null,done:null};render()}
function render(){document.getElementById("shop").textContent=S.shop;document.getElementById("sub").textContent=S.sub==null?DEF.sub:S.sub;var lg=document.getElementById("logo"),em=document.getElementById("emb");lg.hidden=!S.logo;em.style.display=S.logo?"none":"block";if(S.logo)lg.src=S.logo;document.title=S.shop+" – Prenota";var L=V=="l";document.getElementById("land").hidden=!L;document.querySelector(".hero").hidden=L;document.querySelector(".gl").hidden=L;document.getElementById("app").hidden=L;if(L)landFill();else document.getElementById("app").innerHTML=V=="c"?client():admin()}
function client(){
  var h="";
  if(st.done){var b=st.done;return'<div class="ok card">'+IC.p+'<h2>Prenotazione confermata</h2><p><b>'+esc(b.sn)+'</b><br>'+fdate(b.date)+' alle '+b.time+(S.chairs.length>1?'<br><span class="mu">'+esc(cn(b.ch))+'</span>':'')+'</p><p class="mu">Ti aspettiamo, '+esc(b.name)+'.</p><button class="btn" onclick="go(\'c\')">Nuova prenotazione</button></div>'}
  h+='<div class="steps">'+[0,1,2].map(function(i){return'<i class="'+(i<=st.step?'on':'')+'"></i>'}).join("")+'</div>';
  if(st.step==0){
    h+='<h2>Scegli il tuo servizio</h2><div class="grid">'+S.services.map(function(s){
      return'<button class="card svc" onclick="pick('+s.id+')"><span class="price">'+s.p+' €</span>'+IC[s.i]+'<b>'+esc(s.n)+'</b><small>'+dl(s.d)+'</small></button>'}).join("")+'</div>';
  }else if(st.step==1){
    var s=svc(st.sid),d=new Date(),ds=[];
    for(var i=0;i<21;i++)ds.push(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i)));
    h+='<h2>Quando? <span class="mu" style="font-size:15px;font-family:Montserrat,sans-serif">'+esc(s.n)+'</span></h2><div class="days">'+ds.map(function(k){
      var x=new Date(k+"T12:00:00"),open=dayOpen(k);
      return'<div class="day'+(k==st.date?' on':'')+(open?'':' off')+'"'+(open?' onclick="pickD(\''+k+'\')"':'')+'><small>'+DAYS[x.getDay()].slice(0,3)+'</small><b>'+x.getDate()+'</b></div>'}).join("")+'</div>';
    if(st.date){var sl=slots(st.date,s.d);
      h+=sl.length?'<div class="slots">'+sl.map(function(t){return'<button class="slot'+(t==st.time?' on':'')+'" onclick="pickT(\''+t+'\')">'+t+'</button>'}).join("")+'</div>':'<p class="mu">Nessun orario libero in questo giorno.</p>'}
    h+='<div class="row" style="margin-top:20px"><button class="btn ghost" onclick="st.step=0;render()">Indietro</button><button class="btn" '+(st.time?'':'disabled')+' onclick="st.step=2;render()">Continua</button></div>';
  }else{
    var s2=svc(st.sid);
    h+='<h2>Ultimo passo</h2><div class="card"><b>'+esc(s2.n)+'</b> · '+s2.p+' €<br><span class="mu">'+fdate(st.date)+' alle '+st.time+'</span></div>'+
    '<label class="field"><span>Nome e cognome</span><input id="nm" autocomplete="name"></label><label class="field"><span>Telefono</span><input id="tl" type="tel" autocomplete="tel"></label>'+
    '<div class="row"><button class="btn ghost" onclick="st.step=1;render()">Indietro</button><button class="btn" onclick="book()">Conferma prenotazione</button></div>'}
  return h}
function pick(id){st.sid=id;st.date=null;st.time=null;st.step=1;render()}
function pickD(k){st.date=k;st.time=null;render()}
function pickT(t){st.time=t;render()}
function book(){
  var n=document.getElementById("nm").value.trim(),t=document.getElementById("tl").value.trim();
  if(!n||t.length<6){alert("Inserisci nome e telefono.");return}
  var s=svc(st.sid),ch=freeChair(st.date,mins(st.time),s.d);
  if(ch===null){alert("Questo orario non è più disponibile.");st.step=1;render();return}
  var b={id:Date.now(),sid:s.id,sn:s.n,d:s.d,ch:ch,date:st.date,time:st.time,name:n,tel:t};
  S.bookings.push(b);save();st.done=b;render()}
function durOpts(v){var o="";for(var m=15;m<=240;m+=15)o+='<option value="'+m+'"'+(m==v?' selected':'')+'>'+dl(m)+'</option>';return o}
function admin(){
  if(!A)return'<h2>Area proprietario</h2><div class="card"><label class="field"><span>PIN</span><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')login()"></label><button class="btn" onclick="login()">Entra</button><p class="mu">PIN iniziale: 1234 (modificabile nelle impostazioni).</p></div>';
  var today=iso(new Date()),h="<h2>Pannello admin</h2>";
  var bk=S.bookings.filter(function(b){return b.date>=today}).sort(function(a,b){return(a.date+a.time)<(b.date+b.time)?-1:1});
  h+='<h3>Prossime prenotazioni ('+bk.length+')</h3><div class="card">'+(bk.length?bk.map(function(b){return'<div class="bk"><div><b>'+fdate(b.date)+' '+b.time+'</b> · '+esc(b.sn)+'<br><span class="mu">'+esc(b.name)+' · '+esc(b.tel)+' · '+esc(cn(b.ch))+'</span></div><button class="btn ghost sm" onclick="delB('+b.id+')">Annulla</button></div>'}).join(""):'<span class="mu">Nessuna prenotazione.</span>')+'</div>';
  h+='<h3>Poltrone</h3><div class="card">'+S.chairs.map(function(c,i){return'<div class="row"><input value="'+esc(c.n)+'" onchange="S.chairs['+i+'].n=this.value;save()">'+(S.chairs.length>1?'<button class="btn ghost sm" onclick="S.chairs.splice('+i+',1);save();render()">✕</button>':'')+'</div>'}).join("")+'<p class="mu">Ogni poltrona gestisce un cliente alla volta: più poltrone, più prenotazioni nello stesso orario.</p><button class="btn sm" onclick="S.chairs.push({id:Date.now(),n:\'Poltrona \'+(S.chairs.length+1)});save();render()">+ Aggiungi poltrona</button></div>';
  h+='<h3>Servizi, prezzi e durate</h3><div class="card"><p class="mu" style="margin-top:0">Nome · prezzo € · durata · icona</p>'+S.services.map(function(s,i){
    return'<div class="row"><input value="'+esc(s.n)+'" onchange="S.services['+i+'].n=this.value;save()"><input type="number" min="0" value="'+s.p+'" style="max-width:76px" onchange="S.services['+i+'].p=+this.value;save()" aria-label="Prezzo"><select onchange="S.services['+i+'].d=+this.value;save()" aria-label="Durata">'+durOpts(s.d)+'</select><select onchange="S.services['+i+'].i=this.value;save()" aria-label="Icona">'+ICN.map(function(o){return'<option value="'+o[0]+'"'+(s.i==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select><button class="btn ghost sm" onclick="S.services.splice('+i+',1);save();render()">✕</button></div>'}).join("")+
    '<button class="btn sm" onclick="S.services.push({id:Date.now(),n:\'Nuovo servizio\',p:15,d:30,i:\'s\'});save();render()">+ Aggiungi servizio</button></div>';
  h+='<h3>Orari settimanali</h3><div class="card">'+S.hours.map(function(x,i){
    return'<div class="row"><b style="width:100px">'+DAYS[i]+'</b><label><input type="checkbox" style="width:auto" '+(x.x?'checked':'')+' onchange="S.hours['+i+'].x=this.checked?1:0;save()"> Chiuso</label><input type="time" value="'+x.o+'" onchange="S.hours['+i+'].o=this.value;save()"><input type="time" value="'+x.c+'" onchange="S.hours['+i+'].c=this.value;save()"></div>'}).join("")+'</div>';
  h+='<h3>Chiusure straordinarie</h3><div class="card"><div class="row"><input type="date" id="cl"><button class="btn sm" onclick="addC()">Aggiungi</button></div>'+S.closures.sort().map(function(c,i){return'<div class="bk"><span>'+fdate(c)+'</span><button class="btn ghost sm" onclick="S.closures.splice('+i+',1);save();render()">Rimuovi</button></div>'}).join("")+'</div>';
  h+='<h3>Impostazioni</h3><div class="card"><label class="field"><span>Nome del negozio</span><input value="'+esc(S.shop)+'" onchange="S.shop=this.value;save();render()"></label><label class="field"><span>Frase di benvenuto (pagina iniziale)</span><input value="'+esc(S.wel==null?DEF.wel:S.wel)+'" onchange="S.wel=this.value;save()"></label><label class="field"><span>Sottotitolo</span><input value="'+esc(S.sub==null?DEF.sub:S.sub)+'" onchange="S.sub=this.value;save();render()"></label><div class="field"><span>Logo (facoltativo)</span><div class="row">'+(S.logo?'<img src="'+S.logo+'" alt="" style="height:48px;max-width:120px;object-fit:contain"><button class="btn ghost sm" onclick="S.logo=\'\';save();render()">Rimuovi logo</button>':'<span class="mu">Nessun logo: viene mostrato lo stemma.</span>')+'<input type="file" accept="image/*" onchange="upLogo(this)"></div></div><label class="field"><span>Intervallo tra gli orari</span><select onchange="S.step=+this.value;save()">'+[15,30,60].map(function(m){return'<option value="'+m+'"'+(S.step==m?' selected':'')+'>'+dl(m)+'</option>'}).join("")+'</select></label><label class="field"><span>Nuovo PIN</span><input value="'+esc(S.pin)+'" onchange="S.pin=this.value;save()"></label><button class="btn ghost" onclick="A=false;render()">Esci</button></div>';
  h+='<div class="hint">Versione demo: i dati restano salvati in questo browser. Per condividerli tra dispositivi serve collegare un database (es. Supabase).</div>';
  return h}
function upLogo(i){var f=i.files&&i.files[0];if(!f)return;if(f.size>8e6){alert("Immagine troppo grande (max 8 MB).");return}var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);try{S.logo=c.toDataURL("image/png")}catch(e){alert("Impossibile leggere l’immagine.");return}save();render()};im.onerror=function(){alert("File non valido.")};im.src=u}
function login(){if(document.getElementById("pin").value==S.pin){A=true;render()}else alert("PIN errato")}
function delB(id){if(confirm("Annullare la prenotazione?")){S.bookings=S.bookings.filter(function(b){return b.id!=id});save();render()}}
function addC(){var v=document.getElementById("cl").value;if(v&&S.closures.indexOf(v)<0){S.closures.push(v);save();render()}}
document.addEventListener("pointermove",function(e){var c=e.target.closest&&e.target.closest(".svc");if(!c||e.pointerType=="touch")return;var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform="rotateY("+(x*16)+"deg) rotateX("+(-y*16)+"deg) translateZ(10px)"});
document.addEventListener("pointerout",function(e){var c=e.target.closest&&e.target.closest(".svc");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
var busy=0;
function nav(v){if(busy)return;busy=1;var w=document.getElementById('wipe');w.classList.add('on');setTimeout(function(){go(v);window.scrollTo(0,0);document.body.classList.add('enter');w.classList.remove('on');setTimeout(function(){document.body.classList.remove('enter');busy=0},1100)},700)}
function chars(t,o){var i=o;return t.split(' ').map(function(w){return `<span class='w'>`+Array.from(w).map(function(c){return `<span class='ch' style='--i:${i++}'>${esc(c)}</span>`}).join('')+`</span>`}).join(' ')}
function landFill(){var w=S.wel==null?DEF.wel:S.wel,t=S.sub==null?DEF.sub:S.sub;document.getElementById('wl').innerHTML=chars(w,0);document.getElementById('wn').innerHTML=chars(S.shop,w.length);document.getElementById('wt').textContent=t;var lg=document.getElementById('logo2');lg.hidden=!S.logo;if(S.logo)lg.src=S.logo}
(function(){var it=[['c',6,16,70,9,0,.5],['s',84,12,52,11,1,1.1],['c',86,62,86,12,2,.4],['s',9,68,58,10,.5,.8],['c',44,88,58,13,1.5,.6],['s',72,40,36,8,2.5,1.3],['c',22,40,40,10,3,.9]];
document.getElementById('fl').innerHTML=it.map(function(a){return `<div class='f' data-d='${a[6]}' style='left:${a[1]}%;top:${a[2]}%;width:${a[3]}px'><div style='animation-duration:${a[4]}s;animation-delay:-${a[5]}s'>${IC[a[0]]}</div></div>`}).join('');
var L=document.getElementById('land'),b=document.getElementById('mag');
L.addEventListener('pointermove',function(e){if(e.pointerType=='touch')return;var px=e.clientX/innerWidth-.5,py=e.clientY/innerHeight-.5;L.querySelectorAll('.f').forEach(function(f){var d=+f.dataset.d;f.style.transform='translate3d('+(-px*60*d)+'px,'+(-py*60*d)+'px,0)'});var r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);b.style.transform=Math.hypot(dx,dy)<160?'translate('+dx*.22+'px,'+dy*.3+'px)':''});
document.getElementById('cta').addEventListener('click',function(){nav('c')})})();
render();
</script>
